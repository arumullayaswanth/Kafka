# Single node, KRaft (no ZooKeeper): this process is both broker and controller.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
controller.listener.names=CONTROLLER

# Listeners. The advertised address is what clients are told to reconnect to,
# so it must be resolvable from inside the Docker network.
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
advertised.listeners=PLAINTEXT://kafka:9092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

log.dirs=/var/lib/kafka/data

# Topics are created explicitly by kafka-init, never implicitly.
auto.create.topics.enable=false
num.partitions=3

# Single broker: every internal topic must use replication factor 1.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
