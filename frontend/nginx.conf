server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Only these paths reach the backend. /internal/* is deliberately not proxied.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Single-page app: unknown paths (/orders, /dashboard) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, so browsers pick up new builds right away.
    # Files in /assets have a content hash in their name, so caching them is safe.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
