name: kafka-ecommerce-demo

# Shared consumer settings (YAML anchors). Each consumer below overrides role and name.
x-consumer-env: &consumer-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  TOPIC_NAME: ${TOPIC_NAME:-orders}
  BACKEND_URL: http://backend:8000
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}

x-consumer: &consumer
  build: ./consumer
  image: kafka-ecommerce-demo-consumer
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    backend:
      condition: service_healthy

# All services share the default project network (kafka-ecommerce-demo_default).
services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    restart: unless-stopped
    # No "ports:" on purpose. Kafka is reachable only on the Docker network.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot job: creates the "orders" topic, then exits.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    # creates the orders topic.
    entrypoint: ["/bin/bash", "/init-topic.sh"]
    environment:
      TOPIC_NAME: ${TOPIC_NAME:-orders}
    volumes:
      - ./kafka/init-topic.sh:/init-topic.sh:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME:-kafka-cluster}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"

  # FastAPI: REST + WebSocket, publishes to Kafka. Not published to the host;
  # reached only through the frontend's nginx.
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TOPIC_NAME: ${TOPIC_NAME:-orders}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 10s

  # nginx: static UI, proxies /api, /health and /ws to the backend.
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

  # ---- Consumers: 3 groups x 3 consumers = 9 instances, all reading topic "orders". ----
  # Each group gets every event; inside a group each partition has exactly one owner.
  #   order-processing-group   -> order-consumer-1..3
  #   payment-processing-group -> payment-consumer-1..3
  #   notification-group       -> notification-consumer-1..3
  order-consumer-1:
    <<: *consumer
    hostname: order-consumer-1
    environment:
      <<: *consumer-env
      CONSUMER_ROLE: order
      CONSUMER_NAME: order-consumer-1

  order-consumer-2:
    <<: *consumer
    hostname: order-consumer-2
    environment:
      <<: *consumer-env
      CONSUMER_ROLE: order
      CONSUMER_NAME: order-consumer-2

  order-consumer-3:
    <<: *consumer
    hostname: order-consumer-3
    environment:
      <<: *consumer-env
      CONSUMER_ROLE: order
      CONSUMER_NAME: order-consumer-3

  payment-consumer-1:
    <<: *consumer
    hostname: payment-consumer-1
    environment:
      <<: *consumer-env
      CONSUMER_ROLE: payment
      CONSUMER_NAME: payment-consumer-1

  payment-consumer-2:
    <<: *consumer
    hostname: payment-consumer-2
    environment:
      <<: *consumer-env
      CONSUMER_ROLE: payment
      CONSUMER_NAME: payment-consumer-2

  payment-consumer-3:
    <<: *consumer
    hostname: payment-consumer-3
    environment:
      <<: *consumer-env
      CONSUMER_ROLE: payment
      CONSUMER_NAME: payment-consumer-3

  notification-consumer-1:
    <<: *consumer
    hostname: notification-consumer-1
    environment:
      <<: *consumer-env
      CONSUMER_ROLE: notification
      CONSUMER_NAME: notification-consumer-1

  notification-consumer-2:
    <<: *consumer
    hostname: notification-consumer-2
    environment:
      <<: *consumer-env
      CONSUMER_ROLE: notification
      CONSUMER_NAME: notification-consumer-2

  notification-consumer-3:
    <<: *consumer
    hostname: notification-consumer-3
    environment:
      <<: *consumer-env
      CONSUMER_ROLE: notification
      CONSUMER_NAME: notification-consumer-3

volumes:
  kafka-data:
